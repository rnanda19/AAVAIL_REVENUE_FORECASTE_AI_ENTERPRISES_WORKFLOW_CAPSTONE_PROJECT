name: Build Pomodoro Kivy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pomodoro_kivy_app/**"
      - ".github/workflows/build-pomodoro-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with official Buildozer Docker image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/pomodoro_kivy_app:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-clock-apk
          path: pomodoro_kivy_app/bin/*.apk
