name: Build Pomodoro Kivy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pomodoro_kivy_app/**"
      - ".github/workflows/build-pomodoro-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: pomodoro_kivy_app
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-clock-apk
          path: pomodoro_kivy_app/bin/*.apk
